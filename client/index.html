<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Micro E-Racer</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <form id="start">
    <h1>Micro E-Racer</h1>
    <label for="name">Nickname</label>
    <input id="name" maxlength="16" autocomplete="nickname" required>
    <fieldset class="bodies">
      <legend>Body</legend>
      <button type="button" data-body="microbus" aria-pressed="false">Microbus</button>
      <button type="button" data-body="roadster" aria-pressed="true">Roadster</button>
    </fieldset>
    <button id="play" type="submit">Play</button>
    <p id="error" role="alert"></p>
  </form>

  <div id="hud" hidden>
    <div id="pos"></div>
    <div id="lap"></div>
    <div id="msg" aria-live="polite"></div>
    <ol id="results"></ol>
  </div>

  <div id="touch" hidden>
    <div id="steer" aria-label="Steer: drag left or right">◀ ▶</div>
    <button id="brake" type="button">Brake</button>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
