<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Micro E-Racer</title>
  <meta name="description" content="Tiny electric cars, big chaos. Jump into a running Race against up to 7 others and Ram, Zap and Drift round a kitchen, a garden, a desk and a bathtub. Right in your browser, on desktop and mobile.">
  <!-- what Slack, Teams, X and WhatsApp show for a shared link; client/share/ adds the card's image and the icon, and the server makes the URLs absolute -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Micro E-Racer">
  <meta property="og:title" content="Micro E-Racer">
  <meta property="og:description" content="Tiny electric cars, big chaos. Jump into a running Race against up to 7 others and Ram, Zap and Drift round a kitchen, a garden, a desk and a bathtub. Right in your browser, on desktop and mobile.">
  <meta property="og:url" content="/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <form id="start">
    <h1>Micro E-Racer</h1>
    <label for="name">Nickname</label>
    <input id="name" maxlength="16" autocomplete="nickname" required>
    <fieldset class="pick">
      <legend>Body</legend>
      <div id="garage"><canvas id="turntable" aria-hidden="true"></canvas><dl id="stats"></dl></div>
      <button type="button" data-body="roadster" aria-pressed="true">Roadster</button>
      <button type="button" data-body="suv" aria-pressed="false">SUV</button>
      <button type="button" data-body="microbus" aria-pressed="false">Microbus</button>
      <button type="button" data-body="pickup" aria-pressed="false">Pickup</button>
      <button type="button" data-body="semi" aria-pressed="false">Semi</button>
    </fieldset>
    <fieldset id="steering" class="pick" hidden>
      <legend>Steering</legend>
      <button type="button" data-steer="slider" aria-pressed="true">Slider<small>drag left or right</small></button>
      <button type="button" data-steer="buttons" aria-pressed="false">Buttons<small>hold ◀ or ▶</small></button>
    </fieldset>
    <button id="play" type="submit">Play</button>
    <p id="error" role="alert"></p>
  </form>

  <div id="halftone" aria-hidden="true"></div>
  <div id="hud" hidden>
    <div id="pos"></div>
    <div id="lap"></div>
    <div id="energy" data-level="ok" role="meter" aria-label="Energy" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span aria-hidden="true">⚡</span><div class="bar"><div id="energy-fill"></div><div class="limp"></div></div></div>
    <div id="popups"></div>
    <div id="item" aria-label="Item"></div>
    <div id="danger" hidden></div>
    <div id="msg" aria-live="polite"></div>
    <div id="news" aria-live="polite"></div>
    <ol id="results"></ol>
    <p id="offline" hidden>Offline Race: no server, just you and the Bots</p>
  </div>

  <button id="mute" type="button" aria-pressed="false" aria-label="Sound" hidden>🔊</button>

  <div id="touch" hidden>
    <div id="steer" aria-label="Steer: drag left or right"><span>◀</span><svg class="wheel" viewBox="-50 -50 100 100" aria-hidden="true"><g fill="none" stroke-linecap="round"><path d="M-38 0H38M0 0V38" stroke="#111" stroke-width="17"/><circle r="38" stroke="#111" stroke-width="18"/><path d="M-38 0H38M0 0V38" stroke="#3a3f47" stroke-width="9"/><circle r="38" stroke="#3a3f47" stroke-width="10"/><path d="M-9 -36.9A38 38 0 0 1 9 -36.9" stroke="#ffd60a" stroke-width="10" stroke-linecap="butt"/></g><circle r="13" fill="#ffd60a" stroke="#111" stroke-width="4"/></svg><span>▶</span></div>
    <button id="fire" type="button" aria-label="Use the Item"></button>
    <button id="back" type="button" hidden>◀ Back</button>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
