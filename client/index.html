<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Micro E-Racer</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <form id="start">
    <h1>Micro E-Racer</h1>
    <label for="name">Nickname</label>
    <input id="name" maxlength="16" autocomplete="nickname" required>
    <fieldset class="bodies">
      <legend>Body</legend>
      <button type="button" data-body="roadster" aria-pressed="true">Roadster<small>fast, drifty</small></button>
      <button type="button" data-body="suv" aria-pressed="false">SUV<small>all-rounder</small></button>
      <button type="button" data-body="microbus" aria-pressed="false">Microbus<small>grippy, big battery</small></button>
      <button type="button" data-body="pickup" aria-pressed="false">Pickup<small>heavy, pulls hard</small></button>
      <button type="button" data-body="semi" aria-pressed="false">Semi<small>huge, huge battery</small></button>
    </fieldset>
    <button id="play" type="submit">Play</button>
    <p id="error" role="alert"></p>
  </form>

  <div id="halftone" aria-hidden="true"></div>
  <div id="hud" hidden>
    <div id="pos"></div>
    <div id="lap"></div>
    <div id="energy" data-level="ok" role="meter" aria-label="Energy" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span aria-hidden="true">⚡</span><div class="bar"><div id="energy-fill"></div><div class="limp"></div></div></div>
    <div id="popups"></div>
    <div id="item" aria-label="Item"></div>
    <div id="danger" hidden></div>
    <div id="msg" aria-live="polite"></div>
    <ol id="results"></ol>
    <p id="offline" hidden>Offline Race: no server, just you and the Bots</p>
  </div>

  <button id="mute" type="button" aria-pressed="false" aria-label="Sound" hidden>🔊</button>

  <div id="touch" hidden>
    <div id="steer" aria-label="Steer: drag left or right">◀ ▶</div>
    <button id="fire" type="button" aria-label="Shoot, or use the Item">Zap</button>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
